<!DOCTYPE html>
<html lang="fr">
  

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flan Club</title>
  <link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
  
<body>
<a href="https://docs.google.com/forms/d/e/1FAIpQLScXgtDvw31OvlD2ly0UMrAUGnpXPc7MJMw3K40vHbKZVQmLmg/viewform"
   target="_blank"
   rel="noopener noreferrer"
   style="display:block; width:fit-content; margin:30px auto; padding:15px 25px; background:#b86b35; color:white; border-radius:30px; text-decoration:none; font-weight:bold;">
  🍮 Proposer un flan
</a>

  <!-- L'en-tête : le titre et la barre de recherche -->
  <header>
    <p class="badge">Le guide des gourmands</p>
    <h1>Flan <span>Club</span></h1>
    <p class="tagline">Les meilleurs flans du Pays Basque, bientôt de toute la France.</p>
    <div class="recherche">
      <input id="recherche" type="search" placeholder="Cherchez une ville : Bayonne, Biarritz, Hendaye…" aria-label="Rechercher par ville" autocomplete="off">
    </div>
  </header>

  <!-- Le contenu : les fiches de flans sont ajoutées ici par script.js -->
  <main>
    <p id="compteur"></p>
    <div id="liste"></div>
    <p id="vide" hidden>Aucun flan dans cette ville… pour l’instant.</p>
  </main>

  <footer>Prototype — les pâtisseries, prix et notes sont fictifs.</footer>

<section id="section-carte" style="max-width:1100px; margin:40px auto; padding:20px;">
  <h2>🗺️ La carte des flans</h2>
  <p>Découvre les meilleurs flans près de chez toi !</p>
 <button id="btn-geolocalisation" type="button">📍 Me géolocaliser</button>
  <div id="carte-flans" style="height:450px; width:100%; border-radius:15px;"></div>
</section>

  <script src="script.js"></script>
</body>
</html>
